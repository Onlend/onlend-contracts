[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = '0.8.34'
evm_version = 'prague'
via_ir = true
optimizer = true
optimizer_runs = 200
ignored_error_codes_from = [
    # A pool without a given capability leaves that operation's internal function reverting, which makes the AFTER
    # hook after it unreachable in that pool.
    ["src/pool/abstract/BasePool.sol", [5740]],
]

[profile.default.fuzz]
runs = 1_000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

[profile.fast.fuzz]
runs = 10_000

[profile.full.invariant]
runs = 1_024
depth = 64
fail_on_revert = true

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[lint]
severity = ["high", "med", "low", "info", "gas"]
exclude_lints = ["asm-keccak256"]
